$kind: http-request
name: Get Telemetry by Maintenance Status
method: GET
url: '{{baseUrl}}/api/telemetry/maintenance/ok'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Test 1: Status code is 200
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // Test 2: Response is an array
      pm.test("Response is an array", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });

      // Test 3: All records have maintenanceStatus = "ok"
      pm.test("All records have maintenanceStatus 'ok'", function () {
          const json = pm.response.json();
          json.forEach(function(record) {
              pm.expect(record.maintenanceStatus).to.eql("ok");
          });
      });

      // Test 4: Response time is acceptable
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Test 5: Content-Type is JSON
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
