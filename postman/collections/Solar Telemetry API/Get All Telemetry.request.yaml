$kind: http-request
name: Get All Telemetry
method: GET
url: '{{baseUrl}}/api/telemetry'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Test 1: Status code is 200
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      // Test 2: Response is an array
      pm.test("Response is an array", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });

      // Test 3: Response time is acceptable
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      // Test 4: Each record has required fields
      pm.test("Each record has required fields", function () {
          const json = pm.response.json();
          if (json.length > 0) {
              json.forEach(function(record) {
                  pm.expect(record).to.have.property("id");
                  pm.expect(record).to.have.property("panelId");
                  pm.expect(record).to.have.property("temperature");
                  pm.expect(record).to.have.property("maintenanceStatus");
              });
          }
      });

      // Test 5: Content-Type is JSON
      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });
