$kind: http-request
name: Save Telemetry
method: POST
url: '{{baseUrl}}/api/telemetry'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "panelId": "PANEL-001",
      "temperature": 45.2,
      "irradiance": 850.5,
      "voltage": 36.8,
      "current": 8.5,
      "maintenanceStatus": "ok",
      "timestamp": "2024-07-27T10:00:00"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Test 1: Status code is 200 or 201
      pm.test("Status code is 200 or 201", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      // Test 2: Response has an auto-generated id
      pm.test("Response contains auto-generated id", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json.id).to.be.a("number");
      });

      // Test 3: Response body matches sent data
      pm.test("Response body reflects sent panelId", function () {
          const json = pm.response.json();
          pm.expect(json.panelId).to.eql("PANEL-001");
      });

      // Test 4: Response contains all expected fields
      pm.test("Response contains all telemetry fields", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.all.keys("id", "panelId", "temperature", "irradiance", "voltage", "current", "maintenanceStatus", "timestamp");
      });

      // Test 5: Numeric fields are numbers
      pm.test("Numeric fields are numbers", function () {
          const json = pm.response.json();
          pm.expect(json.temperature).to.be.a("number");
          pm.expect(json.irradiance).to.be.a("number");
          pm.expect(json.voltage).to.be.a("number");
          pm.expect(json.current).to.be.a("number");
      });

      // Test 6: maintenanceStatus is a string
      pm.test("maintenanceStatus is a string", function () {
          const json = pm.response.json();
          pm.expect(json.maintenanceStatus).to.be.a("string");
      });

      // Save the id for use in other requests
      const json = pm.response.json();
      if (json && json.id) {
          pm.collectionVariables.set("savedTelemetryId", json.id);
      }
